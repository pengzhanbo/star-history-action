name: Repo Star History
description: Get star history of a repository and write to a file
author: pengzhanbo

branding:
  icon: star
  color: orange

inputs:
  repo:
    description: Repository name(s), e.g. pengzhanbo/star-history-action. Comma or
      space separated to compare multiple repos in one chart
    required: true
    default: ${{ github.repository }}
  token:
    description: GitHub token
    required: true
    default: ${{ github.token }}
  output-directory:
    description: Directory to write the chart file into, relative to the workspace root
    required: false
    default: assets
  output-filename:
    description: Output file name. When both themes are configured, -light/-dark is
      appended before the extension
    required: false
    default: star-history.svg
  svg-width:
    description: Width of the generated SVG in pixels (height is 2/3 of width)
    required: false
    default: '960'
  theme:
    description: Chart theme. light, dark, or comma/space separated "light, dark" to
      output both
    required: false
    default: light
  output-format:
    description: Output file format(s). svg (default) and/or png (rasterized)
      and/or json (structured record data instead of charts); comma/space
      separated to generate several at once, e.g. "svg,png,json"
    required: false
    default: svg
  radar:
    description: Whether to also render a per-repo radar SVG chart of repo health
      metrics (stars, new stars, pushes, contributors, issues closed, forks),
      each scored 0-99
    required: false
    default: 'false'
  cache:
    description: Incremental fetch. Reads the previous run's <stem>.cache.json as
      a baseline and only fetches stargazers added since, slashing API quota on
      repos with large histories
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node.js 24
      # Pin the runner to the Node version this action is built and tested
      # against instead of whatever the hosted runner ships by default.
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Set up pnpm
      # version defaults to the `packageManager` field of this action's package.json
      uses: pnpm/action-setup@v6
    - name: Compute dependency cache key
      id: deps-hash
      shell: bash
      working-directory: ${{ github.action_path }}
      # hashFiles() only resolves paths under GITHUB_WORKSPACE, but this action's
      # own lockfile lives in github.action_path; hash it here and feed the
      # digest to actions/cache as a step output.
      run: echo "lockfile=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >>
        "$GITHUB_OUTPUT"
    - name: Restore dependency cache
      uses: actions/cache@v6
      with:
        # node_modules caches the --prod install result: on a hit the install
        # step below becomes a fast no-op (pnpm only re-verifies the linkage).
        path: ${{ github.action_path }}/node_modules
        key: pnpm-deps-${{ runner.os }}-node24-${{ steps.deps-hash.outputs.lockfile }}
        # A lockfile change misses the exact key but still restores the previous
        # node_modules; pnpm then fills in the delta instead of installing cold.
        restore-keys: |
          pnpm-deps-${{ runner.os }}-node24-
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      # --prod skips devDependencies: only the runtime deps of dist/index.js are needed.
      # --ignore-scripts skips this project's own lifecycle scripts (e.g. the
      # "prepare": "simple-git-hooks" hook installer) and every dependency's
      # install scripts, which must not run inside the action checkout.
      run: pnpm install --frozen-lockfile --prod --ignore-scripts
    - name: Generate star history chart
      shell: bash
      working-directory: ${{ github.action_path }}
      # Inputs reach the action code as INPUT_* environment variables
      # (matching @actions/core's getInput), mirroring the env a JS
      # action runner would set.
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_OUTPUT-DIRECTORY: ${{ inputs.output-directory }}
        INPUT_OUTPUT-FILENAME: ${{ inputs.output-filename }}
        INPUT_SVG-WIDTH: ${{ inputs.svg-width }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_OUTPUT-FORMAT: ${{ inputs.output-format }}
        INPUT_RADAR: ${{ inputs.radar }}
        INPUT_CACHE: ${{ inputs.cache }}
      run: node dist/index.js
